version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rate_limit_db
    environment:
      POSTGRES_DB: rate_limit_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rate_limit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
